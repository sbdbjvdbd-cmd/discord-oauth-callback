services:
  - type: web
    name: zpynq-tiktok-toolkit
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: GUILD_ID
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: OAUTH_REDIRECT_URI
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: TIKTOK_VERIFY_TOKEN
        sync: false
      - key: ALLOWED_CHANNEL_ID
        sync: false
      - key: DATABASE_PATH
        value: data/app.db
